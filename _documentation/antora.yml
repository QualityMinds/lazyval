name: lazyval
title: Lazyval Documentation
version: 'main'
start_page: ROOT:index.adoc
nav:
  - modules/ROOT/nav.adoc
  - modules/spi/nav.adoc

ext:
  collector:
    - scan:
        dir: examples
        into: modules/ROOT/examples
    - scan:
        dir: processor/src/main/java/com/qualityminds/lazyval/processor/codegen
        into: modules/spi/examples
    - scan:
        dir: processor/src/main/java/com/qualityminds/lazyval/processor/spi
        into: modules/spi/examples
    - scan:
        dir: ksp/src/main/kotlin/com/qualityminds/lazyval/ksp/codegen
        into: modules/spi/examples
    - scan:
        dir: ksp/src/main/kotlin/com/qualityminds/lazyval/ksp/spi
        into: modules/spi/examples
