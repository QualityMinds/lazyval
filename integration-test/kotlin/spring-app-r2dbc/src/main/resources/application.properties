spring.application.name=kotlin-spring-app-r2dbc

# Defaults for running the app by hand; the ITs override the URL/credentials with the
# PostgreSQL testcontainer via @DynamicPropertySource.
spring.r2dbc.url=r2dbc:postgresql://localhost:5432/lazyval
spring.r2dbc.username=lazyval
spring.r2dbc.password=lazyval

# R2DBC has no DDL generation, so schema.sql is applied on every start (statements are IF NOT EXISTS).
spring.sql.init.mode=always
