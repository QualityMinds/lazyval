# H2 Configuration
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:testdb;DATABASE_TO_UPPER=FALSE;DB_CLOSE_DELAY=-1

# Hibernate configuration to create/drop the schema on startup
quarkus.hibernate-orm.schema-management.strategy=drop-and-create

# Cassandra
quarkus.cassandra.contact-points=127.0.0.1:9042
quarkus.cassandra.local-datacenter=datacenter1
quarkus.cassandra.keyspace=quarkus

# MongoDB
quarkus.mongodb.connection-string=mongodb://localhost:27017
quarkus.mongodb.database=quarkus
quarkus.mongodb.uuid-representation=standard

# Locales: enable Accept-Language resolution for Hibernate Validator messages.
quarkus.default-locale=en
quarkus.locales=en,de
