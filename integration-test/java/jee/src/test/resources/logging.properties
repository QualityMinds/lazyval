handlers=java.util.logging.ConsoleHandler
.level=INFO

# Silence the noisy Testcontainers container-stdout streamer
org.testcontainers.containers.output.Slf4jLogConsumer.level=OFF
org.testcontainers.level=WARNING
com.github.dockerjava.level=WARNING
tc.level=WARNING

java.util.logging.ConsoleHandler.level=ALL
java.util.logging.ConsoleHandler.formatter=java.util.logging.SimpleFormatter
# One-line format: 10:30:00.123 [INFO ] LoggerName - message
java.util.logging.SimpleFormatter.format=%1$tH:%1$tM:%1$tS.%1$tL [%4$-5s] %2$s - %5$s%6$s%n