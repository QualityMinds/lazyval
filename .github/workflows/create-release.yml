name: Release

on:
  workflow_dispatch:
    inputs:
      releaseVersion:
        description: 'Release version (leave empty for auto-increment)'
        required: false
      developmentVersion:
        description: 'Next development version (leave empty for auto-increment)'
        required: false

permissions:
  contents: write
  actions: read

jobs:

  verify-ci:
    name: Verify latest commit on main was successful
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check CI status
        uses: actions/github-script@v7
        with:
          script: |
            const { data: workflows } = await github.rest.actions.listWorkflowRunsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: 'main',
              per_page: 100
            });

            const ciRuns = workflows.workflow_runs.filter(run => 
              run.name === 'CI' && 
              run.head_sha === context.sha
            );

            if (ciRuns.length === 0) {
              core.setFailed('No CI run found for current commit. Please wait for CI to complete.');
              return;
            }

            const latestCiRun = ciRuns[0];

            if (latestCiRun.status !== 'completed') {
              core.setFailed(`CI is still running (${latestCiRun.status}). Please wait for completion.`);
              return;
            }

            if (latestCiRun.conclusion !== 'success') {
              core.setFailed(`CI failed with status: ${latestCiRun.conclusion}. Cannot proceed with release.`);
              return;
            }

            core.info('✅ CI passed for current commit. Proceeding with release.');

  release:
    name: Perform release
    needs: verify-ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Maven Release
        run: |
          RELEASE_ARGS=""
          if [ -n "${{ github.event.inputs.releaseVersion }}" ]; then
            RELEASE_ARGS="$RELEASE_ARGS -DreleaseVersion=${{ github.event.inputs.releaseVersion }}"
          fi
          if [ -n "${{ github.event.inputs.developmentVersion }}" ]; then
            RELEASE_ARGS="$RELEASE_ARGS -DdevelopmentVersion=${{ github.event.inputs.developmentVersion }}"
          fi
          
          ./mvnw --batch-mode --no-transfer-progress \
            release:prepare release:perform \
            $RELEASE_ARGS
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERTOKEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_USERTOKEN_PASSPHRASE }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}