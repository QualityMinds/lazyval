name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Build and Install to Local Repository
        run: mvn -B install --file pom.xml
      - name: Upload Maven Repository
        uses: actions/upload-artifact@v4
        with:
          name: maven-repo
          path: ~/.m2/repository/
          retention-days: 1

  examples-java-maven:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Download Maven Repository
        uses: actions/download-artifact@v4
        with:
          name: maven-repo
          path: ~/.m2/repository/
      - name: Create Maven 3 wrapper
        working-directory: examples/java
        run: mvn -N wrapper:wrapper -Dmaven=3.9.12
      - name: Run Java-Example with Maven
        working-directory: examples/java
        run: ./mvnw -nsu -B compile

  examples-java-maven-4:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Download Maven Repository
        uses: actions/download-artifact@v4
        with:
          name: maven-repo
          path: ~/.m2/repository/
      - name: Create Maven 4 wrapper
        working-directory: examples/java
        run: mvn -N wrapper:wrapper -Dmaven=4.0.0-rc-5
      - name: Run Java-Example with Maven
        working-directory: examples/java
        run: ./mvnw -nsu -B compile -f pom-maven-4.xml

  examples-java-gradle:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Download Maven Repository
        uses: actions/download-artifact@v4
        with:
          name: maven-repo
          path: ~/.m2/repository/
      - name: Run Java-Example with Gradle
        working-directory: examples/java
        run: gradle build

  examples-java-mill:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Download Maven Repository
        uses: actions/download-artifact@v4
        with:
          name: maven-repo
          path: ~/.m2/repository/
      - name: Clear m2 cache except lazyval (because otherwise coursier will fail to resolve artifacts where only poms are downloaded)
        run: |
          mv ~/.m2/repository/de/qualityminds/lazyval /tmp/lazyval-backup || true
          rm -rf ~/.m2/repository/*
          mkdir -p ~/.m2/repository/de/qualityminds
          mv /tmp/lazyval-backup ~/.m2/repository/de/qualityminds/lazyval || true
      - name: Download Mill Script
        working-directory: examples/java
        run: curl -L https://repo1.maven.org/maven2/com/lihaoyi/mill-dist/1.0.6/mill-dist-1.0.6-mill.sh -o mill && chmod +x mill
      - name: Run Java-Example with Mill
        working-directory: examples/java
        run: ./mill __.compile

  examples-kotlin-maven:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Download Maven Repository
        uses: actions/download-artifact@v4
        with:
          name: maven-repo
          path: ~/.m2/repository/
      - name: Create Maven 3 wrapper
        working-directory: examples/kotlin
        run: mvn -N wrapper:wrapper -Dmaven=3.9.12
      - name: Run Java-Example with Maven
        working-directory: examples/kotlin
        run: ./mvnw -nsu -B compile

  examples-kotlin-maven-4:
    if: false # disabled due to maven-compiler-plugin 4-beta not seeing compiled kotlin classes
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Download Maven Repository
        uses: actions/download-artifact@v4
        with:
          name: maven-repo
          path: ~/.m2/repository/
      - name: Create Maven 4 wrapper
        working-directory: examples/kotlin
        run: mvn -N wrapper:wrapper -Dmaven=4.0.0-rc-5
      - name: Run Java-Example with Maven
        working-directory: examples/kotlin
        run: ./mvnw -nsu -B compile -f pom-maven-4.xml

  examples-kotlin-gradle:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Download Maven Repository
        uses: actions/download-artifact@v4
        with:
          name: maven-repo
          path: ~/.m2/repository/
      - name: Run Kotlin-Example with Gradle
        working-directory: examples/kotlin
        run: gradle build

  examples-kotlin-mill:
    #if: false # disabled due to weird classloading error only on CI
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Download Maven Repository
        uses: actions/download-artifact@v4
        with:
          name: maven-repo
          path: ~/.m2/repository/
      - name: Clear m2 cache except lazyval (because otherwise coursier will fail to resolve artifacts where only poms are downloaded)
        run: |
          mv ~/.m2/repository/de/qualityminds/lazyval /tmp/lazyval-backup || true
          rm -rf ~/.m2/repository/*
          mkdir -p ~/.m2/repository/de/qualityminds
          mv /tmp/lazyval-backup ~/.m2/repository/de/qualityminds/lazyval || true
      - name: Download Mill Script
        working-directory: examples/kotlin
        run: curl -L https://repo1.maven.org/maven2/com/lihaoyi/mill-dist/1.0.6/mill-dist-1.0.6-mill.sh -o mill && chmod +x mill
      - name: Run Kotlin-Example with Mill
        working-directory: examples/kotlin
        run: ./mill __.compile