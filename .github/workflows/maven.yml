name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Build and Install to Local Repository
        run: mvn -B install --file pom.xml
      - name: Upload Maven Repository
        uses: actions/upload-artifact@v4
        with:
          name: maven-repo
          path: ~/.m2/repository/
          retention-days: 1

  examples-java-maven:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Download Maven Repository
        uses: actions/download-artifact@v4
        with:
          name: maven-repo
          path: ~/.m2/repository/
      - name: Run Java-Example with Maven
        working-directory: examples/java
        run: mvn -nsu -B compile

  examples-java-gradle:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Download Maven Repository
        uses: actions/download-artifact@v4
        with:
          name: maven-repo
          path: ~/.m2/repository/
      - name: Run Java-Example with Gradle
        working-directory: examples/java
        run: gradle build

  examples-java-mill:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Download Maven Repository
        uses: actions/download-artifact@v4
        with:
          name: maven-repo
          path: ~/.m2/repository/
      - name: Download Mill Script
        working-directory: examples/java
        run: curl -L https://repo1.maven.org/maven2/com/lihaoyi/mill-dist/1.0.5/mill-dist-1.0.5-mill.sh -o mill && chmod +x mill
      - name: Run Java-Example with Mill
        working-directory: examples/java
        run: ./mill __.compile

  examples-kotlin-gradle:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Download Maven Repository
        uses: actions/download-artifact@v4
        with:
          name: maven-repo
          path: ~/.m2/repository/
      - name: Run Kotlin-Example with Gradle
        working-directory: examples/kotlin
        run: gradle build

  examples-kotlin-mill:
    #if: false # disabled due to weird classloading error only on CI
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Download Maven Repository
        uses: actions/download-artifact@v4
        with:
          name: maven-repo
          path: ~/.m2/repository/
      - name: Populate Coursier cache from Maven repository
        run: |
          mkdir -p ~/.cache/coursier/v1/https/repo1.maven.org/maven2
          # Copy all non-SNAPSHOT dependencies to Coursier's cache format
          cp -r ~/.m2/repository/org ~/.cache/coursier/v1/https/repo1.maven.org/maven2/ || true
          cp -r ~/.m2/repository/com ~/.cache/coursier/v1/https/repo1.maven.org/maven2/ || true
      - name: Download Mill Script
        working-directory: examples/kotlin
        run: curl -L https://repo1.maven.org/maven2/com/lihaoyi/mill-dist/1.0.5/mill-dist-1.0.5-mill.sh -o mill && chmod +x mill
      - name: Run Kotlin-Example with Mill
        working-directory: examples/kotlin
        run: ./mill __.compile