name: Release

on:
  workflow_dispatch:
    inputs:
      releaseVersion:
        description: 'Release version (leave empty for auto-increment)'
        required: false
      developmentVersion:
        description: 'Next development version (leave empty for auto-increment)'
        required: false

permissions:
  contents: write
  actions: read

env:
  JAVA_VERSION: '25'
  JAVA_DISTRIBUTION: 'temurin'

jobs:
  verify-ci:
    name: Verify Main
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Verify CI passed
        uses: ./.github/actions/verify-ci-passed

  release:
    name: Release & Publish
    needs: verify-ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: 'maven'
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run Maven Release and Publish to Maven Central
        run: |
          RELEASE_ARGS="-Darguments=-DskipTests"
          if [ -n "${{ github.event.inputs.releaseVersion }}" ]; then
            RELEASE_ARGS="$RELEASE_ARGS -DreleaseVersion=${{ github.event.inputs.releaseVersion }}"
          fi
          if [ -n "${{ github.event.inputs.developmentVersion }}" ]; then
            RELEASE_ARGS="$RELEASE_ARGS -DdevelopmentVersion=${{ github.event.inputs.developmentVersion }}"
          fi

          ./mvnw --batch-mode --no-transfer-progress \
            release:prepare release:perform \
            $RELEASE_ARGS
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERTOKEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_USERTOKEN_PASSPHRASE }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      - name: Update version references
        working-directory: examples
        run: |
          ./update-lazyval-version.sh "$VERSION"
          git add -A
          git diff --cached --quiet || {
            git commit -m "[release] update example versions to release $VERSION"
            git push
          }
        env:
          VERSION: ${{ github.event.inputs.releaseVersion }}